<!-- Paste into an existing ESP32-P4/S31 project, then select this component
     and import ../assets/RobotExpressive.body.glb in its 3D inspector.
     Import sets data-model3d to the actual project asset ID. -->
<gfx-model3d id="robot-widget"
  data-model3d-clip="0"
  data-model3d-autoplay="true"
  data-model3d-loop="true"
  data-model3d-width="320"
  data-model3d-height="240"
  data-model3d-camera-distance="0"
  style="width:320px;height:240px;background-color:#101723">
</gfx-model3d>
